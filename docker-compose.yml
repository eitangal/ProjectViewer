services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/var/lib/gitportal/data
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SYSADMIN_BOOTSTRAP_EMAIL=${SYSADMIN_BOOTSTRAP_EMAIL:-admin@gitlens-portal.local}
      - PORTAL_BASE_URL=${PORTAL_BASE_URL:-http://localhost}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-GitLens Portal}
    volumes:
      - ./data:/var/lib/gitportal/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portal_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "127.0.0.1:3000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - portal_net
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  portal_net:
    driver: bridge
